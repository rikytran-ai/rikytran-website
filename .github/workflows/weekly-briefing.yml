name: Generate Weekly Executive Briefing

on:
  schedule:
    - cron: '0 11 * * 1' # Runs every Monday at 6:00 AM Central
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements-briefing.txt

      - name: Run Briefing Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          BRANCH_NAME="briefing-${DATE_TAG}"

          git config user.name "riky-content-bot"
          git config user.email "bot@rikytran.com"

          git checkout -b "$BRANCH_NAME"
          git add data/briefings.json

          if ! git diff --cached --quiet; then
            git commit -m "feat(content): update briefings for ${DATE_TAG}"
            git push origin "$BRANCH_NAME"
            gh pr create \
              --title "Executive Briefing: ${DATE_TAG}" \
              --body "Weekly executive perspective generated by Gemini 2.5 Flash into data/briefings.json. Ready to review and deploy." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes found. Skipping PR."
          fi
