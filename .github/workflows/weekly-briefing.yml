name: Generate Weekly Executive Briefing

on:
  schedule:
    - cron: '0 11 * * 1' # Runs every Monday at 6:00 AM Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements-briefing.txt

      - name: Run Briefing Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Commit and Push Directly to Main
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          git config user.name "riky-content-bot"
          git config user.email "bot@rikytran.com"

          git add data/briefings.json

          if ! git diff --cached --quiet; then
            git commit -m "feat(content): automated executive briefing for ${DATE_TAG}"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes found. Skipping commit."
          fi
